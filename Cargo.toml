[workspace]
members = [
  "crates/cadder-operator",
  "crates/cadder",
  "crates/cadder-daemon",
  "crates/cadder-protocol",
  "crates/cadder-shim",
  "crates/cadderd",
  "xtask",
]
resolver = "3"

[workspace.package]
version = "0.8.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/MrMaxie/cadder"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
debug = false
strip = "symbols"
panic = "unwind"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"
