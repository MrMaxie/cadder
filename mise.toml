min_version = "2026.7.16"

[tools]
rust = { version = "1.95.0", components = "rustfmt,clippy,llvm-tools-preview" }
node = "24.18.0"
"npm:@fission-ai/openspec" = "1.5.0"
"cargo:cargo-llvm-cov" = "0.8.7"
"aqua:axodotdev/cargo-dist" = "0.33.0"

[tasks.fmt]
description = "Check Rust formatting"
run = "cargo fmt --all -- --check"

[tasks.lint]
description = "Run workspace lints"
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.test]
description = "Run workspace tests"
run = "cargo test --workspace"

[tasks.openspec-check]
description = "Validate every OpenSpec artifact strictly"
run = [
  "openspec doctor",
  "openspec validate --all --strict --no-interactive",
]

[tasks.docs-check]
description = "Install and validate the documentation site"
dir = "docs/site"
run = [
  "npm ci",
  "npm run check",
]

[tasks.docs-build]
description = "Build the documentation site"
dir = "docs/site"
run = [
  "npm ci",
  "npm run build",
]

[tasks.npm-check]
description = "Validate the Node and Nub npm distribution workspace"
dir = "npm"
run = [
  "nub ci",
  "nub run check",
]

[tasks.coverage]
description = "Enforce the 85 percent workspace line coverage gate"
run = "cargo llvm-cov --workspace --all-features --lcov --output-path target/coverage-summary.lcov --fail-under-lines 85"

[tasks.check]
description = "Run the complete local validation gate"
run = [
  "cargo fmt --all -- --check",
  "cargo clippy --workspace --all-targets -- -D warnings",
  "cargo test --workspace",
  "openspec doctor",
  "openspec validate --all --strict --no-interactive",
  { task = "docs-check" },
  { task = "npm-check" },
  { task = "dist-workflow-check" },
  "dist plan --allow-dirty",
]

[tasks.dev]
description = "Run the TUI with the local mock Caddy backend"
env = { CADDER_CADDY_BACKEND = "mock" }
run = "cargo run --package cadder --bin cadder -- tui"

[tasks.tui-web]
description = "Open the current TUI in ttyglass"
run = "ttyglass -- mise run dev"

[tasks.dist-plan]
description = "Create a non-publishing cargo-dist release plan"
run = [{ task = "dist-workflow-check" }, "dist plan --allow-dirty"]

[tasks.dist-workflow-sync]
description = "Regenerate and harden the cargo-dist GitHub workflow"
run = ["dist generate", "node scripts/harden-dist-workflow.mjs --apply"]

[tasks.dist-workflow-check]
description = "Verify the generated and hardened cargo-dist GitHub workflow"
run = [
  "node --test scripts/test/harden-dist-workflow.test.mjs",
  "node scripts/harden-dist-workflow.mjs --check-generated",
]

[tasks.dist-build]
description = "Build non-publishing cargo-dist artifacts"
run = "dist build --allow-dirty"
