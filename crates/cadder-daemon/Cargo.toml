[package]
name = "cadder-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
docker-e2e = []

[[test]]
name = "testcontainers_e2e"
path = "tests/testcontainers_e2e.rs"
required-features = ["docker-e2e"]

[dependencies]
anyhow = "1.0.102"
cadder-protocol = { version = "0.8.0", path = "../cadder-protocol" }
chrono = { version = "0.4.45", features = ["serde"] }
directories = "6.0.0"
figment = { version = "0.10.19", features = ["toml", "env"] }
fs4 = "1.1.0"
hex = "0.4.3"
interprocess = { version = "2.4.2", features = ["tokio"] }
process-wrap = { version = "=9.1.0", default-features = false, features = ["tokio1", "process-group", "job-object", "kill-on-drop", "creation-flags"] }
rusqlite = { version = "=0.40.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
thiserror = "=2.0.17"
tokio = { version = "1.52.3", features = ["full"] }

[dev-dependencies]
tempfile = "3.27.0"
testcontainers = "0.27.3"

[target."cfg(windows)".dependencies]
is_elevated = "=0.1.2"
widestring = "=1.2.1"
windows = { version = "=0.62.2", default-features = false, features = ["Win32_System_Threading"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Pipes", "Win32_System_Threading"] }

[target."cfg(unix)".dependencies]
libc = "0.2.186"
