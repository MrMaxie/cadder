[package]
name = "cadder-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Cadder portable Caddy coordinator daemon"

[package.metadata.dist]
dist = false

[features]
docker-e2e = []

[[bin]]
name = "cadder-daemon"
path = "src/bin/cadderd.rs"

[[bin]]
name = "cadder-test-process"
path = "tests/fixtures/test_process.rs"
test = false
bench = false
doc = false

[[test]]
name = "testcontainers_e2e"
path = "tests/testcontainers_e2e.rs"
required-features = ["docker-e2e"]

[dependencies]
anyhow = "=1.0.104"
backon = { version = "=1.6.0", default-features = false, features = ["std", "tokio-sleep"] }
bytes = "=1.11.1"
cadder-ipc = { version = "1.0.0", path = "../cadder-ipc" }
caddyfile-rs = "=0.1.0"
chrono = { version = "=0.4.45", features = ["serde"] }
clap = { version = "=4.6.1", features = ["derive"] }
directories = "=6.0.0"
figment = { version = "=0.10.19", features = ["toml", "env"] }
fs4 = "=1.1.0"
futures-util = "=0.3.32"
getrandom = "=0.4.2"
hex = "=0.4.3"
interprocess = { version = "=2.4.2", features = ["tokio"] }
process-wrap = { version = "=9.1.0", default-features = false, features = ["tokio1", "process-group", "kill-on-drop", "job-object"] }
same-file = "=1.0.6"
semver = "=1.0.28"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
thiserror = "=2.0.17"
tokio = { version = "=1.52.3", features = ["full"] }
tokio-rusqlite = { version = "=0.8.0", features = ["bundled"] }
tokio-util = { version = "=0.7.18", features = ["codec", "rt"] }
tracing-subscriber = "=0.3.23"
which = "=8.0.5"

[dev-dependencies]
reqwest = { version = "=0.13.5", default-features = false }
tempfile = "=3.27.0"
testcontainers = "=0.27.3"

[target."cfg(windows)".dependencies]
is_elevated = "=0.1.2"
widestring = "=1.2.1"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Pipes", "Win32_System_Threading", "Win32_UI_Shell"] }

[target."cfg(unix)".dependencies]
libc = "=0.2.186"
