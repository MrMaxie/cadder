[package]
name = "cadder-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "=1.0.102"
cadder-daemon = { version = "0.8.0", path = "../cadder-daemon" }
cadder-operator = { version = "0.8.0", path = "../cadder-operator" }
cadder-protocol = { version = "0.8.0", path = "../cadder-protocol" }
clap = { version = "=4.6.1", features = ["derive"] }
rmcp = { version = "=1.7.0", features = ["transport-io"] }
serde = { version = "=1.0.228", features = ["derive"] }
tokio = { version = "=1.52.3", features = ["full"] }

[dev-dependencies]
chrono = { version = "=0.4.45", features = ["serde"] }
rmcp = { version = "=1.7.0", features = ["client", "transport-child-process", "which-command"] }
tempfile = "=3.27.0"
