[package]
name = "cadder-client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "cadder"
path = "src/main.rs"

[dependencies]
cadder-daemon = { version = "0.8.0", path = "../cadder-daemon" }
cadder-api = { version = "0.8.0", path = "../cadder-api" }
cadder-ipc = { version = "0.8.0", path = "../cadder-ipc" }
clap = { version = "4.6.1", features = ["derive"] }
color-eyre = "0.6.5"
crossterm = "0.29.0"
ratatui = "0.30.2"
tokio = { version = "=1.52.3", features = ["rt"] }
tui-term = "0.3.4"
