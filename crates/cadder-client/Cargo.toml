[package]
name = "cadder-client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.dist]
dist = false

[[bin]]
name = "cadder-client"
path = "src/main.rs"

[dependencies]
cadder-api = { version = "1.0.0", path = "../cadder-api" }
cadder-ipc = { version = "1.0.0", path = "../cadder-ipc" }
clap = { version = "=4.6.6", features = ["derive"] }
color-eyre = "=0.6.5"
crossterm = { version = "=0.29.0", features = ["event-stream"] }
ratatui = "=0.30.2"
tokio = { version = "=1.53.1", features = ["macros", "rt", "time"] }
futures-util = "=0.3.34"
tokio-util = { version = "=0.7.19", features = ["rt"] }
netstat2 = "=0.11.2"
sysinfo = { version = "=0.39.6", default-features = false, features = ["system"] }
comfy-table = { version = "=8.0.0", default-features = false }

[dev-dependencies]
chrono = { version = "=0.4.45", features = ["serde"] }
tempfile = "=3.27.0"
