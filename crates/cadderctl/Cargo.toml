[package]
name = "cadderctl"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Cadder non-TUI CLI for daemon state, domains, logs, and automation"

[dependencies]
anyhow = "1.0.102"
cadder-daemon = { version = "0.8.0", path = "../cadder-daemon" }
cadder-operator = { version = "0.8.0", path = "../cadder-operator" }
cadder-protocol = { version = "0.8.0", path = "../cadder-protocol" }
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full"] }

[dev-dependencies]
tempfile = "3.27.0"
