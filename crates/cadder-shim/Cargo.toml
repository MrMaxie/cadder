[package]
name = "cadder-shim"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Cadder PATH-facing Caddy shim"

[package.metadata.dist]
dist = false

[[bin]]
name = "cadder-shim"
path = "src/main.rs"

[dependencies]
anyhow = "=1.0.104"
cadder-api = { version = "1.0.0", path = "../cadder-api" }
cadder-ipc = { version = "1.0.0", path = "../cadder-ipc" }
chrono = { version = "=0.4.45", features = ["serde"] }
clap = { version = "=4.6.1", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.52.3", features = ["full"] }

[dev-dependencies]
tempfile = "=3.27.0"
