name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: jdx/mise-action@v4.2.3
      - run: mise run fmt
      - run: mise run lint
      - run: mise run test

  project-contracts:
    name: Project contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: nubjs/setup-nub@21b317c170eee658503996209cf87b63481be35a
        with:
          node-version: 24.18.0
          nub-version: 0.7.5
          package-manager-cache: false
      - uses: jdx/mise-action@v4.2.3
      - run: mise run openspec-check
      - run: mise run docs-check
      - run: mise run npm-check

  coverage:
    name: Coverage (Windows MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: jdx/mise-action@v4.2.3
      - run: mise run coverage
      - if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-lcov-windows-msvc
          path: target/coverage-summary.lcov
          if-no-files-found: ignore
          retention-days: 14

  docker-e2e:
    name: Docker E2E (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: jdx/mise-action@v4.2.3
      - run: docker version
      - run: cargo build --package cadder --bin cadderd --bin caddy
      - run: cargo test -p cadder-daemon --features docker-e2e --test testcontainers_e2e -- --ignored --test-threads=1
