version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
      time: "08:00"
      timezone: Europe/Warsaw
    open-pull-requests-limit: 1
    groups:
      cargo-version-updates:
        applies-to: version-updates
        patterns:
          - "*"
      cargo-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
    commit-message:
      prefix: chore

  - package-ecosystem: npm
    directory: /docs/site
    schedule:
      interval: monthly
      time: "08:00"
      timezone: Europe/Warsaw
    open-pull-requests-limit: 1
    groups:
      docs-version-updates:
        applies-to: version-updates
        patterns:
          - "*"
      docs-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: chore

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "08:00"
      timezone: Europe/Warsaw
    open-pull-requests-limit: 1
    groups:
      actions-version-updates:
        applies-to: version-updates
        patterns:
          - "*"
      actions-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
    # cargo-dist owns these references in the generated release workflow.
    ignore:
      # Repository Actions policy allows this exact reviewed version.
      - dependency-name: jdx/mise-action
      - dependency-name: actions/attest
      - dependency-name: actions/checkout
      - dependency-name: actions/download-artifact
      - dependency-name: actions/upload-artifact
      - dependency-name: swatinem/rust-cache
    commit-message:
      prefix: chore
